version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-acs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acs_user
      POSTGRES_PASSWORD: acs_password
      POSTGRES_DB: access_control_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acs_user -d access_control_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
